<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>
  <style>:root{--bg:#0a0a0f;--card:#121216;--border:#23232a;--orange:#f59e0b;--green:#22c55e;--blue:#38bdf8;--text-muted:#a1a1aa;--safe-area-inset-top:0px}body,html{margin:0;padding:0;background:#050507;min-height:100vh}*{box-sizing:border-box}body{font-family:Inter,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}button,input{font-family:inherit}</style>
</head>
<body>
  <div id="lock" style="position:fixed; inset:0; z-index:99999; background:#0b0b0f; display:flex; align-items:center; justify-content:center; font-family:sans-serif;">
  <div style="background:#15151d; padding:30px; border-radius:16px; text-align:center; width:320px; border:1px solid #333;">
    <h2 style="color:#fff; margin:0 0 5px 0;">LEAGUECS TEAM Global Moderators & Moderators</h2>
    <p style="color:#aaa; font-size:13px; margin:0 0 20px 0;">Introdu parola pentru a continua</p>
    <input id="pw" type="password" placeholder="Parola..." style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#0b0b0f; color:#fff; outline:none; box-sizing:border-box;">
    <button onclick="checkPw()" style="width:100%; margin-top:12px; padding:12px; border:none; border-radius:10px; background:#3b82ff; color:#fff; font-weight:800; cursor:pointer;">INTRĂ</button>
    <p id="err" style="color:#ff5555; font-size:12px; display:none; margin:15px 0 0 0;">Parolă greșită, încearcă din nou.</p>
  </div>
</div>

<script>
  const PAROLA_CORRECTA = "leaguecs";

  if (sessionStorage.getItem("league_unlocked") === "da") {
    document.getElementById("lock").style.display = "none";
  }

  function checkPw() {
    const v = document.getElementById("pw").value;
    if (v === PAROLA_CORRECTA) {
      sessionStorage.setItem("league_unlocked", "da");
      document.getElementById("lock").style.display = "none";
    } else {
      document.getElementById("err").style.display = "block";
    }
  }

  document.getElementById("pw").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPw();
  });
</script>
