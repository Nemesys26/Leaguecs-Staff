:root{
  --bg:#050506;
  --surface:#090a0d;
  --panel:#101116;
  --line:#292b32;
  --muted:#8e899c;
  --text:#fff;
  --accent:#9b7cff;
  --green:#72e88a
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Aptos","Segoe UI",Arial,Helvetica,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 16px 30px;
  background:radial-gradient(circle at 50% 0,rgba(155,124,255,.12),transparent 34%),var(--bg)
}

.topbar{
  max-width:1080px;
  margin:0 auto;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line)
}

.brand{
  display:flex;
  align-items:center;
  gap:12px
}

.brand .diamond{
  font-size:28px;
  color:var(--accent)
}

.brand strong{
  display:block;
  letter-spacing:3px
}

.brand small{
  color:var(--muted);
  font-size:12px
}

.topmeta{
  display:flex;
  gap:18px;
  color:var(--muted);
  font-size:13px
}

.topmeta b{
  color:#fff
}

main{
  max-width:1080px;
  margin:0 auto
}

.intro{
  display:grid;
  grid-template-columns:1.55fr .85fr;
  gap:26px;
  padding:42px 0 26px
}

.eyebrow{
  color:var(--accent);
  letter-spacing:3px;
  font-weight:800;
  font-size:12px
}

.intro h1{
  font-size:clamp(38px,6vw,62px);
  line-height:.98;
  letter-spacing:-2px;
  margin:14px 0
}

.intro h1 span{
  color:#b7a8ff
}

.lede{
  color:#b9b4c8;
  max-width:560px;
  line-height:1.6
}

.introCard{
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  overflow:hidden;
  align-self:center
}

.miniHero{
  height:118px;
  background:#15141f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  gap:3px
}

.miniHero strong{
  color:#fff;
  letter-spacing:4px
}

.miniHero span{
  font-size:10px;
  letter-spacing:2px
}

.miniRow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  border-top:1px solid var(--line);
  font-size:13px
}

.miniRow span{
  color:var(--muted)
}

.controls{
  display:grid;
  grid-template-columns:1fr 1.5fr auto auto auto auto;
  gap:10px;
  padding:16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px
}

.field label,.bulk label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
  color:#c9c5d6
}

.field input,.field select,.memberInput input,.bulk textarea,.search input{
  width:100%;
  background:#121316;
  border:1px solid #33353f;
  color:#fff;
  border-radius:7px;
  padding:10px 11px;
  outline:none
}

.field input:focus,.field select:focus,.memberInput input:focus,.bulk textarea:focus,.search input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(155,124,255,.18)
}

.controls button,.savebar button,.codeHead button,.tabs button,.membersHead button,.bulk button,.modal button,.empty button,.notice button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid #343642;
  background:#17181f;
  color:#fff;
  border-radius:8px;
  padding:10px 12px;
  font-weight:700;
  font-size:13px;
  white-space:nowrap
}

.controls .primary,.codeHead .primary,.modal .primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}

.controls .accent{
  background:#ff8c00;
  border-color:#ff8c00
}

.savebar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px 18px;
  margin:12px 0;
  padding:12px 14px;
  border:1px solid #203424;
  background:#0d1510;
  border-radius:10px;
  color:#b8cbbf;
  font-size:13px
}

.savebar>span{
  display:flex;
  align-items:center;
  gap:7px
}

.savebar strong{
  color:var(--green)
}

.savebar small{
  margin-left:auto
}

.notice{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1d182f;
  border:1px solid #51467f;
  padding:11px 13px;
  border-radius:9px;
  margin-bottom:14px
}

.notice button{
  border:0;
  background:transparent;
  padding:2px
}

.tabs{
  display:flex;
  gap:6px;
  margin:22px 0 14px
}

.tabs button{
  padding:11px 16px;
  border:0;
  background:transparent;
  color:var(--muted)
}

.tabs button.active{
  background:#1b1c24;
  color:#fff
}

.tabs span{
  background:var(--accent);
  color:#fff;
  border-radius:20px;
  padding:1px 7px;
  font-size:11px
}

.panel{
  padding-bottom:20px
}

.editorHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:16px;
  margin-bottom:16px
}

.editorHead h2,.codeHead h2{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-size:22px
}

.editorHead p,.codeHead p{
  color:var(--muted);
  font-size:13px;
  margin:6px 0 0
}

.search{
  font-size:12px;
  color:var(--muted);
  font-weight:700
}

.search input{
  margin-top:6px;
  min-width:240px
}

.categories{
  display:grid;
  gap:14px
}

.editorCard{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px
}

.catHead{
  display:flex;
  align-items:center;
  gap:12px
}

.catNo{
  width:42px;
  height:42px;
  border-radius:9px;
  display:grid;
  place-items:center;
  font-weight:900;
  color:#050506
}

.catHead h3{
  margin:0
}

.catHead span{
  color:var(--muted);
  font-size:12px
}

.catHead .danger{
  margin-left:auto;
  color:#ff9c9c
}

.catGrid{
  display:grid;
  grid-template-columns:1.65fr .8fr;
  gap:18px;
  margin-top:16px
}

.withThumb{
  display:flex;
  gap:10px
}

.thumb{
  width:126px;
  flex:none;
  border-radius:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#050506;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px
}

.field small{
  color:var(--muted);
  font-size:11px;
  display:block;
  margin-top:6px
}

.colorRow{
  display:flex;
  gap:8px;
  align-items:center
}

.colorRow input[type=color]{
  width:44px;
  height:42px;
  padding:3px
}

.swatch{
  width:42px;
  height:42px;
  border-radius:7px;
  border:1px solid #444
}

.mt{
  margin-top:14px
}

.membersHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px
}

.memberGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.memberInput{
  display:flex
}

.memberInput input{
  border-radius:7px 0 0 7px
}

.memberInput button{
  border:1px solid #343642;
  border-left:0;
  background:#191a21;
  color:#aaa;
  border-radius:0 7px 7px 0;
  padding:0 9px
}

.bulk{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:end
}

.bulk label{
  grid-column:1/-1;
  margin:0
}

.bulk textarea{
  min-height:68px;
  resize:vertical
}

.empty{
  text-align:center;
  padding:30px;
  border:1px dashed #444;
  border-radius:10px;
  color:var(--muted)
}

.gradeField{
  margin-top:16px
}

.gradeField input{
  font-weight:700
}

.previewGrade{
  max-width:582px;
  margin:28px auto 4px;
  text-align:center;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase
}

.previewWrap .bannerPlace:has(+ .card){
  margin-top:0
}

.grades{
  display:grid;
  gap:14px
}

.gradeHead{
  align-items:flex-start
}

.gradeTitle{
  flex:1;
  min-width:0
}

.gradeTitle label{
  display:block;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:2px
}

.gradeTitleInput{
  width:100%;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  color:#fff;
  font-size:24px;
  font-weight:900;
  line-height:1.2;
  padding:4px 8px;
  margin-left:-8px;
  outline:none
}

.gradeTitleInput:hover{
  border-color:#343642
}

.gradeTitleInput:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(155,124,255,.18);
  background:#121316
}

.gradeTitle>span{
  display:block;
  margin-top:2px
}

.previewGrade{
  max-width:582px;
  margin:28px auto 0;
  text-align:center;
  font-size:14px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase
}

.previewGrade + .bannerPlace{
  margin-top:6px
}

.previewNote{
  display:flex;
  gap:10px;
  align-items:center;
  background:#121316;
  border:1px solid var(--line);
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:16px;
  color:#bdb8cc;
  font-size:13px
}

.previewNote b{
  margin-left:auto;
  color:#fff
}

.previewWrap{
  max-width:820px;
  margin:0 auto;
  padding:18px;
  background:#090a0d;
  border:1px solid var(--line);
  border-radius:14px
}

.hero{
  text-align:center;
  padding:28px 15px;
  margin-bottom:30px;
  background:#101116;
  border:1px solid var(--line);
  border-radius:10px
}

.heroMark{
  color:var(--accent);
  font-size:28px
}

.hero strong{
  display:block;
  letter-spacing:5px;
  font-size:22px
}

.hero span{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:3px;
  margin:5px 0 10px
}

.hero code,.bannerPlace code{
  font-size:10px;
  color:#77798b;
  word-break:break-all
}

.bannerPlace{
  max-width:582px;
  width:100%;
  margin:30px auto 7px;
  border-radius:8px;
  min-height:58px;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:center;
  background:#15161d
}

.bannerDot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:none
}

.bannerPlace strong{
  display:block;
  font-size:11px;
  letter-spacing:2px
}

.card{
  border:2px solid var(--c);
  border-radius:10px;
  background:#121316;
  overflow:hidden;
  box-shadow:0 0 12px var(--glow);
  margin-bottom:10px
}

.card .bar{
  height:4px;
  background:var(--c)
}

.card .names{
  padding:22px;
  text-align:center;
  line-height:2.2;
  font-size:18px;
  font-weight:bold;
  color:var(--c)
}

.card .names span{
  display:block
}

.card .names.small{
  font-size:14px
}

.card .names.medium{
  font-size:16px
}

.footer{
  margin-top:35px;
  padding:20px;
  text-align:center;
  border-top:1px solid #302d3e;
  color:var(--muted);
  font-size:10px;
  letter-spacing:4px
}

.footer .diamond{
  color:var(--accent);
  font-size:16px
}

.footer .domain{
  font-size:20px;
  letter-spacing:4px
}

.codeHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:14px
}

.codeHead>div:last-child{
  display:flex;
  gap:8px
}

.codePanel pre{
  background:#0a0b0e;
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  overflow:auto;
  max-height:720px;
  white-space:pre-wrap;
  word-break:break-word;
  color:#d5d1e5;
  font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace
}

.appFoot{
  max-width:1080px;
  margin:20px auto 0;
  padding:18px 0;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  letter-spacing:1px
}

.modalBack{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:grid;
  place-items:center;
  padding:18px;
  z-index:20
}

.modal{
  background:#15161d;
  border:1px solid #3a3d49;
  border-radius:14px;
  padding:20px;
  max-width:720px;
  width:100%
}

.modal textarea{
  width:100%;
  min-height:240px;
  background:#0a0b0e;
  color:#ddd;
  border:1px solid #333;
  padding:12px;
  border-radius:8px;
  margin:12px 0
}

.modal>div{
  display:flex;
  justify-content:flex-end;
  gap:8px
}

@media(max-width:820px){
  .shell{
    padding-left:10px;
    padding-right:10px
  }

  .topmeta span{
    display:none
  }

  .intro{
    grid-template-columns:1fr;
    padding-top:28px
  }

  .controls{
    grid-template-columns:1fr 1fr
  }

  .controls .field{
    grid-column:1/-1
  }

  .savebar small{
    margin-left:0;
    width:100%
  }

  .editorHead{
    align-items:flex-start;
    flex-direction:column
  }

  .search,.search input{
    width:100%
  }

  .catGrid,.memberGrid{
    grid-template-columns:1fr
  }

  .bulk{
    grid-template-columns:1fr
  }

  .bulk button{
    width:100%
  }

  .catHead{
    flex-wrap:wrap
  }

  .catHead .danger{
    margin-left:0
  }

  .codeHead{
    flex-direction:column;
    align-items:flex-start
  }

  .appFoot{
    flex-direction:column;
    gap:5px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#050506;
    --surface:#090a0d
  }
}
